name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: unit tests
        run: pytest tests/unit -q
      - name: no-hardcoded-models guard
        run: pytest tests/unit/test_no_hardcoded_models.py -q

  integration:
    runs-on: ubuntu-latest
    # No `services: postgres` here — the suite starts its own disposable Postgres via
    # testcontainers (Docker is available on the runner). CORE_API_TOKEN/ARTIFACTS_DIR are
    # required by Settings (alembic env.py reads get_settings()); the suite sets DATABASE_URL.
    env:
      CORE_API_TOKEN: ci-tok
      ARTIFACTS_DIR: /tmp/ai-fund-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: integration tests
        run: pytest -m integration -q
