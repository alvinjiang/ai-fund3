name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: unit tests
        run: pytest tests/unit -q
      - name: no-hardcoded-models guard
        run: pytest tests/unit/test_no_hardcoded_models.py -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: t
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:t@localhost:5432/test
      CORE_API_TOKEN: ci-tok
      ARTIFACTS_DIR: /tmp/ai-fund-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # testcontainers (used by the suite) needs no Docker-in-Docker here: the service
      # postgres above is for any direct DATABASE_URL use; the suite starts its own container.
      - name: integration tests
        run: pytest -m integration -q
