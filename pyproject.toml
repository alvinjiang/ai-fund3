[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fund3"
version = "0.1.0"
description = "AI Fund v3 — Mattermost-decoupled research system: initiation pipeline, lead-per-equity accountability, git-versioned dossiers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Alvin" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.0,<26",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg2-binary>=2.9,<3",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "APScheduler>=3.10,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<0.9",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.12,<4",
    "pytest-cov>=5,<7",
    "testcontainers[postgres]>=4.8,<5",
]

[project.scripts]
fund = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "runner*", "adapter*", "cli*"]
exclude = ["tests*", "doctrine*", "specs*", "design*", "docs*", "proprietary*", "dossiers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"core/api/**" = ["B008"]  # FastAPI requires Depends() in argument defaults (B008 false positive)

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests that require external services or operator-provided URLs",
    "allow_network: opt-in unit tests that intentionally exercise real networking",
]
